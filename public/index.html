<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PixelDiary</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --indigo-950: #2b2f66;
    --indigo-800: #3d4394;
    --indigo-700: #4a51b4;
    --indigo-500: #6c74e0;
    --indigo-300: #b3b8f2;
    --indigo-100: #e6e8fc;
    --linen: #f7f5f0;
    --linen-raised: #ffffff;
    --ink: #2a2a33;
    --muted: #7d7a86;
    --jade: #2f9e77;
    --rust: #c94f36;
    --line: #dedbd3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--linen);
    color: var(--ink);
    font-family: "Manrope", sans-serif;
    line-height: 1.5;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  header {
    margin-bottom: 40px;
  }

  h1 {
    font-family: "Lora", serif;
    font-weight: 600;
    font-size: 2.4rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    color: var(--indigo-950);
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.98rem;
    max-width: 46ch;
  }

  /* --- Film-strip dropzone --- */
  .dropzone {
    position: relative;
    border: 1.5px dashed #c9c6dc;
    border-radius: 10px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    background: var(--linen-raised);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .dropzone::before, .dropzone::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 10px;
    background-image: radial-gradient(circle, var(--linen) 2.5px, transparent 2.6px);
    background-size: 20px 10px;
    background-repeat: repeat-x;
    background-position: 6px center;
  }
  .dropzone::before { top: -1px; border-top: 1.5px dashed #c9c6dc; }
  .dropzone::after { bottom: -1px; border-bottom: 1.5px dashed #c9c6dc; }

  .dropzone.drag-over,
  .dropzone.has-files {
    border-color: var(--indigo-500);
  }

  .dropzone strong {
    display: block;
    font-family: "Lora", serif;
    font-size: 1.15rem;
    font-weight: 500;
    margin-bottom: 4px;
    color: var(--indigo-950);
  }

  .dropzone span {
    color: var(--muted);
    font-size: 0.92rem;
  }

  .dropzone input[type="file"] { display: none; }

  /* --- Contact sheet --- */
  .contact-sheet {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 6px;
    margin-top: 20px;
  }

  .frame {
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--linen-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    text-align: center;
    overflow: hidden;
  }

  .frame .name {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.62rem;
    color: var(--muted);
    word-break: break-all;
  }

  .frame.state-food { border-color: var(--jade); box-shadow: inset 0 0 0 1px var(--jade); }
  .frame.state-report { border-color: var(--indigo-500); box-shadow: inset 0 0 0 1px var(--indigo-500); }
  .frame.state-other { border-color: var(--muted); }
  .frame.state-skipped { border-color: var(--rust); opacity: 0.5; }

  /* --- Actions --- */
  .actions {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  button.develop {
    font-family: "Manrope", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    background: var(--indigo-700);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 12px 22px;
    cursor: pointer;
    transition: box-shadow 0.3s ease, transform 0.1s ease;
  }

  button.develop:disabled {
    background: #e8e6ef;
    color: var(--muted);
    cursor: not-allowed;
  }

  button.develop:not(:disabled):hover {
    transform: translateY(-1px);
  }

  button.develop.developing {
    animation: safelight-pulse 1.6s ease-in-out infinite;
  }

  @keyframes safelight-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74, 81, 180, 0.45); }
    50% { box-shadow: 0 0 0 10px rgba(74, 81, 180, 0); }
  }

  .status-line {
    font-size: 0.88rem;
    color: var(--muted);
    font-family: "JetBrains Mono", monospace;
  }

  /* --- Developing log --- */
  .develop-log {
    margin-top: 28px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
    display: none;
  }

  .develop-log.visible { display: block; }

  .develop-log h2 {
    font-family: "JetBrains Mono", monospace;
    text-transform: none;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .log-lines {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.82rem;
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .log-lines div { color: var(--muted); }
  .log-lines div.food { color: var(--jade); }
  .log-lines div.report { color: var(--indigo-500); }
  .log-lines div.skipped { color: var(--rust); }

  /* --- Journal paper panel --- */
  .journal {
    margin-top: 28px;
    background: var(--linen-raised);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px 30px;
    display: none;
    box-shadow: 0 10px 30px rgba(43, 47, 102, 0.08);
  }

  .journal.visible { display: block; }

  .journal h2 {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--indigo-700);
    margin: 0 0 14px;
  }

  .journal p {
    font-family: "Lora", serif;
    font-size: 1.15rem;
    line-height: 1.65;
    margin: 0;
    max-width: 62ch;
  }

  .journal .saved-note {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--indigo-100);
    font-family: "JetBrains Mono", monospace;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .journal .saved-note a {
    color: var(--indigo-700);
    font-weight: 500;
  }

  .error-banner {
    margin-top: 20px;
    border: 1px solid var(--rust);
    color: var(--rust);
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 0.88rem;
    display: none;
  }

  .error-banner.visible { display: block; }
</style>
</head>
<body>
<main>
  <header>
    <h1>PixelDiary</h1>
    <p>Drop in today's photos and it develops a short journal entry from them &mdash; entirely on this machine. Nothing you upload here leaves your computer.</p>
  </header>

  <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose photos">
    <strong id="dropzoneTitle">Drop today's photos</strong>
    <span>or click to browse &middot; JPG / PNG</span>
    <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple />
  </div>

  <div class="contact-sheet" id="contactSheet"></div>

  <div class="actions">
    <button class="develop" id="developButton" disabled>Develop journal</button>
    <span class="status-line" id="statusLine"></span>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="develop-log" id="developLog">
    <h2>developing log</h2>
    <div class="log-lines" id="logLines"></div>
  </div>

  <div class="journal" id="journalPanel">
    <h2 id="journalDate">journal entry</h2>
    <p id="journalText"></p>
    <div class="saved-note" id="savedNote" style="display:none;">
      <span id="savedText"></span>
      <a id="downloadLink" href="#" download>Download .md</a>
    </div>
  </div>
</main>

<script>
  const dropzone = document.getElementById("dropzone");
  const dropzoneTitle = document.getElementById("dropzoneTitle");
  const fileInput = document.getElementById("fileInput");
  const contactSheet = document.getElementById("contactSheet");
  const developButton = document.getElementById("developButton");
  const statusLine = document.getElementById("statusLine");
  const errorBanner = document.getElementById("errorBanner");
  const developLog = document.getElementById("developLog");
  const logLines = document.getElementById("logLines");
  const journalPanel = document.getElementById("journalPanel");
  const journalDate = document.getElementById("journalDate");
  const journalText = document.getElementById("journalText");
  const savedNote = document.getElementById("savedNote");
  const savedText = document.getElementById("savedText");
  const downloadLink = document.getElementById("downloadLink");

  let selectedFiles = [];

  function frameIdFor(name) {
    return "frame-" + name.replace(/[^a-zA-Z0-9]/g, "_");
  }

  function renderContactSheet() {
    contactSheet.innerHTML = "";
    for (const file of selectedFiles) {
      const frame = document.createElement("div");
      frame.className = "frame";
      frame.id = frameIdFor(file.name);
      const label = document.createElement("div");
      label.className = "name";
      label.textContent = file.name;
      frame.appendChild(label);
      contactSheet.appendChild(frame);
    }
  }

  function handleFiles(fileList) {
    selectedFiles = Array.from(fileList).filter((f) => /\.(jpe?g|png)$/i.test(f.name));
    dropzone.classList.toggle("has-files", selectedFiles.length > 0);
    dropzoneTitle.textContent = selectedFiles.length > 0
      ? `${selectedFiles.length} photo(s) loaded`
      : "Drop today's photos";
    developButton.disabled = selectedFiles.length === 0;
    renderContactSheet();
    resetOutputPanels();
  }

  function resetOutputPanels() {
    errorBanner.classList.remove("visible");
    errorBanner.textContent = "";
    developLog.classList.remove("visible");
    logLines.innerHTML = "";
    journalPanel.classList.remove("visible");
    journalText.textContent = "";
    savedNote.style.display = "none";
    statusLine.textContent = "";
  }

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") fileInput.click();
  });
  fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

  ["dragenter", "dragover"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add("drag-over");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove("drag-over");
    })
  );
  dropzone.addEventListener("drop", (e) => {
    if (e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files);
  });

  function addLogLine(text, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = text;
    logLines.appendChild(line);
    logLines.scrollTop = logLines.scrollHeight;
  }

  function markFrame(name, state, extra) {
    const frame = document.getElementById(frameIdFor(name));
    if (!frame) return;
    frame.classList.add("state-" + state);
    if (extra) {
      const badge = document.createElement("div");
      badge.className = "name";
      badge.textContent = extra;
      frame.appendChild(badge);
    }
  }

  async function developJournal() {
    if (selectedFiles.length === 0) return;
    resetOutputPanels();
    developLog.classList.add("visible");

    developButton.disabled = true;
    developButton.classList.add("developing");
    developButton.textContent = "Developing...";

    const formData = new FormData();
    for (const file of selectedFiles) formData.append("photos", file);

    try {
      const response = await fetch("/api/generate", { method: "POST", body: formData });
      if (!response.ok || !response.body) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.error || `Server responded with ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let journalStarted = false;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let newlineIndex;
        while ((newlineIndex = buffer.indexOf("\n")) !== -1) {
          const line = buffer.slice(0, newlineIndex);
          buffer = buffer.slice(newlineIndex + 1);
          if (!line.trim()) continue;

          const event = JSON.parse(line);
          switch (event.type) {
            case "status":
              statusLine.textContent = event.message;
              break;
            case "photo":
              markFrame(event.file, event.label, `${event.label} ${(event.confidence * 100).toFixed(0)}%`);
              addLogLine(`${event.file} -> ${event.label} (${(event.confidence * 100).toFixed(0)}%)`, event.label);
              break;
            case "photo-skipped":
              markFrame(event.file, "skipped", "skipped");
              addLogLine(`${event.file} -> skipped (${event.reason})`, "skipped");
              break;
            case "model-loading":
              statusLine.textContent = "Loading the on-device language model...";
              break;
            case "model-download":
              statusLine.textContent = `Downloading model: ${event.percentage.toFixed(0)}%`;
              break;
            case "model-ready":
              statusLine.textContent = "Writing journal entry...";
              break;
            case "token":
              if (!journalStarted) {
                journalStarted = true;
                journalPanel.classList.add("visible");
                journalDate.textContent = "journal entry";
              }
              journalText.textContent += event.text;
              break;
            case "done":
              statusLine.textContent = "Done.";
              savedText.textContent = `Saved as journal-output/${event.savedAs}`;
              downloadLink.href = `/journal/${encodeURIComponent(event.savedAs)}`;
              savedNote.style.display = "flex";
              break;
            case "error":
              throw new Error(event.message);
          }
        }
      }
    } catch (err) {
      errorBanner.textContent = err.message || String(err);
      errorBanner.classList.add("visible");
      statusLine.textContent = "";
    } finally {
      developButton.disabled = selectedFiles.length === 0;
      developButton.classList.remove("developing");
      developButton.textContent = "Develop journal";
    }
  }

  developButton.addEventListener("click", developJournal);
</script>
</body>
</html>
